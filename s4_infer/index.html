<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Genre Classifier</title>
        <!-- Google Fonts: Open Sans -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />
        <!-- Libraries -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous"
        />
        <!-- Custom CSS -->
        <link rel="stylesheet" href="custom.css" />
    </head>

    <body>
        <header>
            <h1 id="header-title"></h1>
        </header>

        <div id="main-container">
            <div class="row g-0" id="main-row">
                <div class="col-md-4 col-lg-3" id="songs">
                    <div id="songs-inner">
                        <div class="input-group" id="search-group">
                            <input type="text" id="search" class="form-control" placeholder="Search..." />

                            <select id="sort" class="form-select">
                                <option value="name">Name</option>
                                <option value="result">Result</option>
                            </select>
                        </div>

                        <div id="list"></div>

                        <button id="download-results" type="button" class="btn btn-outline-secondary btn-sm">
                            Download results
                        </button>
                    </div>
                </div>

                <div class="col-md-8 col-lg-9" id="stats">
                    <div id="stats-inner">
                        <div id="stats-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"
        ></script>
        <!-- Custom JS -->
        <script src="results.js"></script>
        <script src="comments.js"></script>
        <script src="custom.js"></script>
    </body>
</html>
